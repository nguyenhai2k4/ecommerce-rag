[project]
name = "llamaindex-document-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "nguyenhai2k4", email = "nguyenhai1032004@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-google-genai>=0.6.0",
    "llama-index-embeddings-openai>=0.7.0",
    "llama-index-llms-google-genai>=0.11.3",
    "llama-index-llms-openai>=0.8.3",
    "llama-index-readers-file>=0.7.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
]

[project.scripts]
llamaindex-document-agent = "llamaindex_document_agent:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
